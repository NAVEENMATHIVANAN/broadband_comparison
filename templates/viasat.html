<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }}</title><link rel="stylesheet" href="/static/style.css"><style>
.wrap{max-width:1000px;margin:2rem auto;padding:0 1rem}.panel-v{background:#fff;border:1px solid #ddd;border-radius:14px;padding:1.25rem;margin:1rem 0}.form-v{display:grid;grid-template-columns:2fr 1fr;gap:1rem}.wide{grid-column:1/-1}.form-v label{display:block;font-weight:600;margin-bottom:.35rem}.form-v input{box-sizing:border-box;width:100%;padding:.8rem;border:1px solid #aaa;border-radius:8px}.actions{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}.actions button{padding:.8rem 1.1rem;border:0;border-radius:8px;cursor:pointer}.muted-v{color:#666;font-size:.92rem}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem}.plan{border:1px solid #ddd;border-radius:12px;padding:1rem;overflow-wrap:anywhere}.plan h3{margin-top:0}@media(max-width:650px){.form-v{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><header class="topbar"><div class="brand"><span>◉</span> Broadband Compare India</div><a href="/">Back to comparison</a></header><main class="wrap"><p><a href="/">← Return to broadband catalogue</a></p><section class="panel-v"><h1>Check Viasat plans for an address</h1><p>Enter a US service address. The lookup uses Browserbase to open Viasat's official address-check flow.</p><form id="form" class="form-v"><div class="wide"><label for="street">Street address *</label><input id="street" required minlength="4" maxlength="250" autocomplete="street-address" placeholder="Street address"></div><div><label for="unit">Apartment / Unit (optional)</label><input id="unit" maxlength="80" autocomplete="address-line2" placeholder="Apt, unit, suite"></div><div><label for="zip">ZIP code *</label><input id="zip" required pattern="[0-9]{5}(-[0-9]{4})?" maxlength="10" autocomplete="postal-code" placeholder="e.g. 90210"></div><div class="wide actions"><button id="go" type="submit">Check Viasat plans</button><span class="muted-v">Address is not saved to your catalogue.</span></div></form></section><section class="panel-v" aria-live="polite"><h2>Lookup result</h2><p id="status">Enter an address to begin.</p><p id="meta" class="muted-v"></p><div id="cards" class="cards"></div></section></main><script>
const form=document.getElementById('form'),statusBox=document.getElementById('status'),meta=document.getElementById('meta'),cards=document.getElementById('cards'),go=document.getElementById('go');
function line(card,label,value){const p=document.createElement('p'),b=document.createElement('strong');b.textContent=label+': ';p.append(b,document.createTextNode(value===null||value===undefined||value===''?'Not published':String(value)));card.append(p)}
form.addEventListener('submit',async e=>{e.preventDefault();cards.replaceChildren();meta.textContent='';statusBox.textContent='Checking address with Viasat; this can take a little time.';go.disabled=true;go.textContent='Checking...';try{const res=await fetch('/api/viasat/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({street_address:document.getElementById('street').value.trim(),unit:document.getElementById('unit').value.trim(),zipcode:document.getElementById('zip').value.trim()})});const d=await res.json();if(!res.ok)throw new Error(d.detail||'Lookup failed');statusBox.textContent=d.message||'Lookup completed';meta.textContent='Status: '+d.status+' · Checked: '+(d.checked_at||'unknown');for(const p of (d.plans||[])){const c=document.createElement('article');c.className='plan';const h=document.createElement('h3');h.textContent=p.plan_name;c.append(h);line(c,'Provider',p.provider);line(c,'Promotional monthly price',p.promotional_monthly_price==null?'Not published':'$'+Number(p.promotional_monthly_price).toFixed(2));line(c,'Regular monthly price',p.regular_monthly_price==null?'Not published':'$'+Number(p.regular_monthly_price).toFixed(2));line(c,'Advertised speeds',p.advertised_speeds_mbps?.length?p.advertised_speeds_mbps.join(', ')+' Mbps':'Not published');line(c,'Data allowance',p.data_allowance_gb==null?'Not published':p.data_allowance_gb+' GB');line(c,'Details',p.plan_details);const a=document.createElement('a');a.href=p.source_url||d.source_url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='View source ↗';c.append(a);cards.append(c)}if(!d.plans?.length){const p=document.createElement('p');p.className='muted-v';p.textContent='No address-specific plan cards were extracted. This does not prove service is unavailable. Check the official result page or try later.';cards.append(p)}if(d.source_url){const a=document.createElement('a');a.href=d.source_url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Open Viasat result page ↗';meta.append(document.createTextNode(' · '),a)}}catch(err){statusBox.textContent=err.message}finally{go.disabled=false;go.textContent='Check Viasat plans'}});
</script></body></html>
